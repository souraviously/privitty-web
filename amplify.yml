version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20 || nvm install 20
        # --include=dev forces npm to install devDependencies even when
        # NODE_ENV=production (which Amplify sets). Build tools like tailwindcss,
        # typescript, prisma CLI, tsx, etc. live in devDependencies and are
        # required during the build phase.
        - npm ci --include=dev
    build:
      commands:
        # Persist build-time env vars to .env.production so the Next.js server
        # can read them at runtime. grep exits 1 when there are no matches
        # (e.g. vars not yet configured), so we append "|| true" to prevent
        # that from aborting the build.
        - env | grep -E '^(DATABASE_URL|S3_|NEXT_PUBLIC_|ENABLE_LOCAL_STORAGE_FALLBACK)' >> .env.production || true
        - npx prisma migrate deploy
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
