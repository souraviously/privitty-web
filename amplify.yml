version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20 || nvm install 20
        # --include=dev forces npm to install devDependencies even when
        # NODE_ENV=production (which Amplify sets). Build tools like tailwindcss,
        # typescript, prisma CLI, tsx, etc. live in devDependencies and are
        # required during the build phase.
        - npm ci --include=dev
    build:
      commands:
        # Amplify console env vars exist only at build time; Next.js server code
        # reads them at runtime from .env.production, so persist them here.
        - env | grep -E '^(DATABASE_URL|S3_|NEXT_PUBLIC_|ENABLE_LOCAL_STORAGE_FALLBACK)' >> .env.production
        - npx prisma migrate deploy
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
