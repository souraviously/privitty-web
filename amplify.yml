version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20 || nvm install 20
        - npm ci --include=dev

    build:
      commands:
        # Persist Amplify environment variables
        - env | grep -E '^(DATABASE_URL|S3_|NEXT_PUBLIC_|ENABLE_LOCAL_STORAGE_FALLBACK)' >> .env.production || true

        # Build Next.js application
        - npm run build

        # Verify generated CSS
        - echo "Checking generated CSS files..."
        - find .next -type f -name "*.css" | head -30
        - echo "Checking generated CSS size..."
        - find .next -type f -name "*.css" -exec wc -c {} \; | head -30

        # Remove build cache before deployment packaging
        - rm -rf .next/cache

        # Check final artifact size
        - echo "Final production artifact size:"
        - du -sh .next
        - du -sh .next/*

  artifacts:
    baseDirectory: .next
    files:
      - '**/*'

  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
